name: Check local prototype

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify preinstalled tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22 || typeof WebSocket !== "function") process.exit(1)'
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Model, UI-double, and static tests
        shell: bash
        run: node --test imagery-app/tests/*.test.cjs
      - name: Syntax and synthetic fixture checks
        shell: bash
        run: |
          set -euo pipefail
          node --check imagery-app/tests/browser-cdp.cjs
          node imagery-app/tests/browser-cdp.cjs --check-fixtures
      - name: Real Chrome browser checks with sandbox enabled
        timeout-minutes: 23
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BROWSER_TEST_OUTPUT: ${{ runner.temp }}/imagery-browser-results
        run: node imagery-app/tests/browser-cdp.cjs
      - name: Prepare and verify portable files without publishing
        timeout-minutes: 1
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ runner.temp }}/imagery-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          EVIDENCE_URL: https://github.com/woodkill00/aphantasia_build/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          source_commit="$(git rev-parse HEAD)"
          echo "The current run URL is a supplied reference only; this run is still in progress."
          node scripts/build-release.cjs \
            --version 0.8.0-preview.1 \
            --source-commit "$source_commit" \
            --tested-html-sha256 b3361a68f8ba585fcd3300b435a0ca7a38d3634446763a8983c194645b203bf8 \
            --evidence-url "$EVIDENCE_URL" \
            --output "$RELEASE_OUTPUT"
          node scripts/verify-release.cjs "$RELEASE_OUTPUT"
