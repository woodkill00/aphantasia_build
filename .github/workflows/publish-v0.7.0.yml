name: Verify the prepared v0.7.0 draft and publish once

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.7.0.yml]

permissions: {}

concurrency:
  group: publish-fixed-v0.7.0
  cancel-in-progress: false

jobs:
  publish-fixed-preview:
    if: github.repository == 'woodkill00/aphantasia_build' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the protected and reviewed publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tools without installing anything
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          git --version
      - name: Verify the exact prepared draft then publish only v0.7.0
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: node scripts/publish-v0.7.0.cjs
