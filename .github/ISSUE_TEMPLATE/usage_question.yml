name: Usage question
description: Ask about opening the app, editing or keeping files.
title: "[Help]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with imagery-app/README.md and docs/troubleshooting.md.
        This is a public software-help discussion, not a medical support service. No response time is guaranteed.
        For vulnerabilities use SECURITY.md and the private reporting route instead.
  - type: textarea
    id: question
    attributes:
      label: What do you need help doing?
      description: Describe the task and where you got stuck without personal observations or health information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, browser and opening method
      description: Include app/browser version and whether you opened extracted HTML locally, if relevant. Unknown is acceptable.
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Mention the guide or example you followed and any exact error after removing private text.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This question and its attachments contain only information I intend to share publicly, with no private notes, credentials or personal exports.
          required: true
